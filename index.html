<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Name That Canadian!</title>
  <meta name="description" content="Live Canadian trivia game show — watch the hints and guess the answer!">
  <meta name="theme-color" content="#060913">
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="style.css">
</head>
<body class="mobile-only-app audience-page" data-page="show" data-theme="midnight">

  <div class="ambient-glow-1"></div>
  <div class="ambient-glow-2"></div>

  <div id="view-container" data-current-view="show">

    <div id="categories-load-error" class="splash-error hidden">
      Could not load question packs. Check your connection and refresh.
    </div>

    <div id="view-show" class="show-layout">
      <div class="presenter-header">
        <div class="presenter-branding">NAME THAT <span>CANADIAN</span></div>
        <div class="presenter-round-info">
          <div id="solo-presenter-round-name" class="presenter-round-name">Round 1: Cultural Icons</div>
          <div id="solo-presenter-q-num" class="presenter-q-num">Question 1 of 5</div>
        </div>
      </div>

      <div class="presenter-container">
        <div class="presenter-main">
          <div id="solo-presenter-facts-container" class="presenter-facts-layout"></div>
          <div id="solo-presenter-leaderboard-container" class="presenter-leaderboard-container hidden">
            <div class="leaderboard-header">Scoreboard</div>
            <div id="solo-presenter-leaderboard-entries" class="leaderboard-entries"></div>
          </div>
          <div class="presenter-timer-layout">
            <div id="solo-presenter-timer" class="timer-circle">
              <svg>
                <circle class="bg-circle" cx="70" cy="70" r="54"></circle>
                <circle id="solo-presenter-timer-ring" class="progress-circle" cx="70" cy="70" r="54" stroke-dasharray="340" stroke-dashoffset="0"></circle>
              </svg>
              <div id="solo-presenter-timer-value" class="timer-value">40</div>
            </div>
          </div>
        </div>
      </div>

      <div id="solo-presenter-screen-overlay" class="screen-overlay hidden">
        <div class="screen-overlay-content">
          <h2 id="solo-presenter-overlay-title" class="overlay-title">Round Complete</h2>
          <p id="solo-presenter-overlay-subtitle" class="overlay-subtitle">Get ready…</p>
          <div id="solo-presenter-overlay-podium" class="overlay-podium hidden"></div>
        </div>
      </div>

      <div id="solo-presenter-reveal-overlay" class="reveal-overlay hidden">
        <div class="reveal-glow-bg"></div>
        <div class="reveal-subtitle">🍁 Who is it? 🍁</div>
        <h2 id="solo-presenter-answer-name" class="reveal-title">Terry Fox</h2>
        <div class="reveal-media-container">
          <img id="solo-presenter-answer-image" class="reveal-image hidden" src="" alt="Answer portrait">
          <div id="solo-presenter-avatar-fallback" class="avatar-fallback">TF</div>
        </div>
        <div id="solo-presenter-answer-notes" class="reveal-notes-box">Loading…</div>
      </div>
    </div>
  </div>

  <script src="js/config.js"></script>
  <script src="audio.js"></script>
  <script src="sync.js"></script>
  <script src="app.js"></script>

</body>
</html>
